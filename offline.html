<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport=device-width, initial-scale=1.0">    name="viewport"

  <meta name="theme-color" content="#062c54">

  <title>GSR Currency Exchange | Offline</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 24px;
      color: #203040;
      background: #f3f7fa;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .offline-card {
      width: min(440px, 100%);
      padding: 34px;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 12px 35px rgba(6, 44, 84, 0.15);
    }

    img {
      width: 120px;
      height: 120px;
      margin: 0 auto 18px;
      object-fit: contain;
    }

    h1 {
      color: #062c54;
    }

    p {
      line-height: 1.6;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    a {
      display: inline-block;
      padding: 13px 20px;
      border-radius: 8px;
      color: #ffffff;
      background: #078447;
      font-weight: bold;
      text-decoration: none;
    }

    .call {
      background: #062c54;
    }
  </style>
</head>

<body>
  <main class="offline-card">
    <img
      src="./logo.png"
      alt="GSR Currency Exchange logo">

    <h1>You are currently offline</h1>

    <p>
      Internet access is needed to load updated website information.
      You can still call GSR Currency Exchange.
    </p>

    <p>
      <strong>Open daily:</strong><br>
      9:00 AM–9:00 PM
    </p>

    <p>
      D2, Kundan Nagar, Awadhpuri, Bhopal
    </p>

    <div class="actions">
      <a
        class="call"
        href="tel:+919425787414">
        Call Now
      </a>

      <a
        href="https://wa.me/919425787414">
        WhatsApp
      </a>
    </div>
  </main>
</body>
</html>
